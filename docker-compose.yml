x-rails-env: &rails-env
  RAILS_ENV: development
  DB_HOST: db
  DB_USERNAME: ecommerce
  DB_PASSWORD: ecommerce_dev_password
  APP_HOST: ${APP_HOST:-localhost}
  APP_PORT: ${APP_PORT:-3000}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  SMTP_ADDRESS: ${SMTP_ADDRESS:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_DOMAIN: ${SMTP_DOMAIN:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
  INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-}
  INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}

x-rails-app: &rails-app
  build:
    context: ./Backend
    dockerfile: dockerfile
    target: development
  working_dir: /rails
  volumes:
    - ./Backend:/rails
    - bundle_data:/usr/local/bundle
  environment:
    <<: *rails-env

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_dev_password
      POSTGRES_DB: ecommerce_development
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Rails + Hotwire (Turbo/Stimulus) uygulaması: HTML ve JSON aynı controller'lardan sunulur.
  web:
    <<: *rails-app
    command: sh -c "bundle check || bundle install; rm -f tmp/pids/server.pid; bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Tailwind CSS çıktısını (app/assets/builds/tailwind.css) değişikliklerde yeniden üretir.
  css:
    <<: *rails-app
    command: sh -c "bundle check || bundle install; bin/rails tailwindcss:watch[always]"
    depends_on:
      - web

volumes:
  postgres_data:
  bundle_data:
